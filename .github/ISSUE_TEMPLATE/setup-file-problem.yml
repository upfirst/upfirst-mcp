name: Problem with a setup file
description: A file in this repository is wrong, or it does not work in your AI client.
body:
  - type: dropdown
    id: client
    attributes:
      label: AI client
      options:
        - Gemini CLI
        - Cursor
        - Claude Code
        - VS Code
        - Other
    validations:
      required: true
  - type: input
    id: client-version
    attributes:
      label: Client version
      placeholder: "For example: 0.9.0"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the exact error message if there is one. Do not paste tokens or passwords.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
